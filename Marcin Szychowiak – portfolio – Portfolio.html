    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }

<body>
  <div id="__bundler_placeholder">Loading Marcin Szychowiak – portfolio...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

00;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"189edb0a-8b33-41d3-8b77-07417edb40a1\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nbody{margin:0;background:#F2F4F1}\nhtml{scroll-behavior:smooth}\na{color:inherit}\na:hover{opacity:.8}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"background: #F2F4F1; color: #0F1C17; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 17px; line-height: 1.55\" data-canvas-width=\"1280\" data-canvas-height=\"3200\">\n\n<div style=\"border-bottom: 1px solid #D5DCD7\">\n<div style=\"max-width: 1120px; margin: 0 auto; padding: 20px 24px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 16px 32px; justify-content: space-between; align-items: center\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px; letter-spacing: 0.06em; font-weight: 500\">MARCIN SZYCHOWIAK<\u002Fdiv>\n<nav style=\"display: flex; flex-wrap: wrap; gap: 8px 28px; font-size: 15px; font-weight: 500\">\n<a href=\"#projekty\" style=\"text-decoration: none\">Projekty<\u002Fa>\n<a href=\"#kompetencje\" style=\"text-decoration: none\">Kompetencje<\u002Fa>\n<a href=\"#sciezka\" style=\"text-decoration: none\">Ścieżka<\u002Fa>\n<a href=\"#kontakt\" style=\"text-decoration: none\">Kontakt<\u002Fa>\n<\u002Fnav>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"max-width: 1120px; margin: 0 auto; padding: 88px 24px 72px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 48px; align-items: center\">\n<div style=\"flex: 1 1 480px; min-width: 0\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: {{accent}}; font-weight: 500\">Menedżer operacyjny · usprawnianie procesów · Wrocław<\u002Fdiv>\n<h1 style=\"margin: 20px 0 0; max-width: 900px; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: clamp(38px, 6.4vw, 72px); line-height: 1.04; letter-spacing: -0.02em\">Zamieniam operacyjny chaos w procesy, które działają.<\u002Fh1>\n<p style=\"margin: 28px 0 0; max-width: 680px; font-size: 20px; color: #3B4A44\">Od 20 lat pracuję z zespołami: od sali i sklepu po festiwal z setką wolontariuszy. Gdy gotowe narzędzia nie wystarczają, projektuję rozwiązania i prototypy, a wdrożenie na skalę firmy robię razem z działem IT.<\u002Fp>\n<div style=\"margin-top: 36px; display: flex; flex-wrap: wrap; gap: 12px\">\n<a href=\"mailto:marcinszychowiak90@gmail.com\" style=\"display: inline-flex; align-items: center; min-height: 48px; padding: 0 24px; box-sizing: border-box; background: {{accent}}; color: #FFFFFF; border-radius: 10px; font-weight: 600; text-decoration: none\">Napisz do mnie<\u002Fa>\n<a href=\"https://www.linkedin.com/in/marcin-szychowiak-6a5962325/\" style=\"display: inline-flex; align-items: center; min-height: 48px; padding: 0 24px; box-sizing: border-box; border: 1.5px solid #0F1C17; border-radius: 10px; font-weight: 600; text-decoration: none\">Profil na LinkedIn<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<img src=\"129b0482-b97a-4340-887b-f2074aefb561\" alt=\"Marcin Szychowiak\" style=\"flex: 0 1 340px; width: 340px; max-width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 16px; display: block\">\n<\u002Fdiv>\n\n<div style=\"background: #0F1C17; color: #F2F4F1\">\n<div style=\"max-width: 1120px; margin: 0 auto; padding: 48px 24px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 36px 48px\">\n<div style=\"flex: 1 1 280px; min-width: 0\">\n<div style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 44px; line-height: 1.1\">30–100<\u002Fdiv>\n<div style=\"margin-top: 8px; color: #C9D4CE; font-size: 16px\">wolontariuszy w zespole, który prowadzę na SLOT Art Festival od 2006 roku<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 280px; min-width: 0\">\n<div style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 44px; line-height: 1.1\">5 liderów<\u002Fdiv>\n<div style=\"margin-top: 8px; color: #C9D4CE; font-size: 16px\">i ok. 50 pracowników w strukturze, którą zarządzałem kaskadowo w ostatniej roli<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 280px; min-width: 0\">\n<div style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 44px; line-height: 1.1\">6 h → &lt;1 h<\u002Fdiv>\n<div style=\"margin-top: 8px; color: #C9D4CE; font-size: 16px\">w moich testach prototypu: skrócenie procesu operacyjnego w sieci handlowej<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"projekty\" style=\"max-width: 1120px; margin: 0 auto; padding: 88px 24px 24px; box-sizing: border-box\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: {{accent}}; font-weight: 500\">Projekty<\u002Fdiv>\n<h2 style=\"margin: 12px 0 0; max-width: 760px; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: clamp(30px, 4.4vw, 46px); line-height: 1.1; letter-spacing: -0.015em\">Trzy projekty, jeden schemat: problem, narzędzie, wynik.<\u002Fh2>\n\n<div style=\"margin-top: 40px; display: flex; flex-wrap: wrap; gap: 24px; align-items: stretch\">\n\n<div style=\"flex: 1 1 320px; min-width: 0; box-sizing: border-box; background: #FFFFFF; border: 1px solid #D5DCD7; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 18px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: #4A5A53\">Aplikacja · eventy<\u002Fdiv>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 26px; line-height: 1.15\">Grafik wolontariuszy w konwencji misji<\u002Fh3>\n<div>\n<div style=\"font-weight: 600; font-size: 14px; color: {{accent}}\">Problem<\u002Fdiv>\n<p style=\"margin: 4px 0 0; font-size: 16px; color: #3B4A44\">Wolontariuszom nikt nie płaci, więc grafik musi być sprawiedliwy: pokryć zapotrzebowanie festiwalu i uwzględnić prośby ludzi oraz wydarzenia, w których chcą uczestniczyć. Dla 30 osób samo układanie grafiku (obsady, uprawnienia, przerwy między zmianami, kolizje godzin) zajmowało około 12 godzin, a dzień festiwalu opierał się na karteczce z zadaniami.<\u002Fp>\n<\u002Fdiv>\n<div>\n<div style=\"font-weight: 600; font-size: 14px; color: {{accent}}\">Rozwiązanie<\u002Fdiv>\n<ul style=\"margin: 6px 0 0; padding-left: 20px; font-size: 16px; color: #3B4A44; display: flex; flex-direction: column; gap: 6px\">\n<li>Automatyczne planowanie obsady według zapotrzebowania, preferencji ludzi i wymogów stanowiska, np. pełnoletności.<\u002Fli>\n<li>Kontrola przerw między zmianami i kolizji godzin. Grafik sam się aktualizuje, gdy ktoś wypadnie lub dołączy.<\u002Fli>\n<li>Panel wolontariusza: meldunek w pracy, podgląd grafiku, potwierdzanie zadań zdjęciem.<\u002Fli>\n<li>Misje i agenci zamiast suchej listy zadań, co angażuje ludzi.<\u002Fli>\n<li>Raport osobisty po evencie: godziny, zadania, pochwały. Osobny raport dla organizatora.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<div style=\"margin-top: auto; padding-top: 16px; border-top: 1px solid #D5DCD7\">\n<div style=\"font-weight: 600; font-size: 14px; color: {{accent}}\">Wynik<\u002Fdiv>\n<p style=\"margin: 4px 0 0; font-size: 16px; color: #3B4A44\">Układanie grafiku dla 30 osób: ok. 12 h → 2–3 h. Aplikacja działa w praktyce przy 20–30 użytkownikach.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex: 1 1 320px; min-width: 0; box-sizing: border-box; background: #FFFFFF; border: 1px solid #D5DCD7; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 18px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: #4A5A53\">Narzędzie wewnętrzne · RAG<\u002Fdiv>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 26px; line-height: 1.15\">Buddy: asystent procedur firmy<\u002Fh3>\n<div>\n<div style=\"font-weight: 600; font-size: 14px; color: {{accent}}\">Problem<\u002Fdiv>\n<p style=\"margin: 4px 0 0; font-size: 16px; color: #3B4A44\">Procedury w firmach są rozrzucone, a ich znalezienie wymaga znajomości właściwych słów kluczowych. To, co dla twórców systemu i mentora jest oczywiste (np. która pieczątka do którego dokumentu), dla nowej osoby bywa przeszkodą, a każde pytanie zabiera czas także koledze.<\u002Fp>\n<\u002Fdiv>\n<div>\n<div style=\"font-weight: 600; font-size: 14px; color: {{accent}}\">Rozwiązanie<\u002Fdiv>\n<ul style=\"margin: 6px 0 0; padding-left: 20px; font-size: 16px; color: #3B4A44; display: flex; flex-direction: column; gap: 6px\">\n<li>Jedno miejsce na procedury firmy.<\u002Fli>\n<li>Przy każdej procedurze miejsce na własne notatki i dodatkowe procesy: nowa osoba uzupełnia system tym, co sama musiała zapamiętać.<\u002Fli>\n<li>Wyszukiwanie RAG: wystarczy opisać, co trzeba załatwić, bez słów kluczowych.<\u002Fli>\n<li>Agent znajduje właściwy proces i prowadzi krok po kroku.<\u002Fli>\n<li>Projekt autorski i prototyp. Wdrożenie na skalę firmy wymaga zespołu IT i zabezpieczeń.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<div style=\"margin-top: auto; padding-top: 16px; border-top: 1px solid #D5DCD7\">\n<div style=\"font-weight: 600; font-size: 14px; color: {{accent}}\">Wynik<\u002Fdiv>\n<p style=\"margin: 4px 0 0; font-size: 16px; color: #3B4A44\">Sprawdzone na sobie podczas wdrożenia w nowej pracy: przy dostawach bezpośrednich nie musiałem dopytywać kolegi, która pieczątka do którego dokumentu. Wystarczyło zapytać Buddy'ego, wzbogaconego o moje notatki.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex: 1 1 320px; min-width: 0; box-sizing: border-box; background: #FFFFFF; border: 1px solid #D5DCD7; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 18px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: #4A5A53\">Handel detaliczny · proces<\u002Fdiv>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 26px; line-height: 1.15\">Proces sklepowy: z 6 godzin do niecałej godziny<\u002Fh3>\n<div>\n<div style=\"font-weight: 600; font-size: 14px; color: {{accent}}\">Problem<\u002Fdiv>\n<p style=\"margin: 4px 0 0; font-size: 16px; color: #3B4A44\">Jeden z procesów operacyjnych w sieci sklepów zajmował około sześciu godzin. Pomnożone przez całą sieć, to tysiące godzin pracy rocznie.<\u002Fp>\n<\u002Fdiv>\n<div>\n<div style=\"font-weight: 600; font-size: 14px; color: {{accent}}\">Rozwiązanie<\u002Fdiv>\n<ul style=\"margin: 6px 0 0; padding-left: 20px; font-size: 16px; color: #3B4A44; display: flex; flex-direction: column; gap: 6px\">\n<li>Prototyp autorskiego rozwiązania skracającego proces do niecałej godziny.<\u002Fli>\n<li>Zaprojektowane z myślą o skali całej sieci, nie jednego sklepu.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<div style=\"margin-top: auto; padding-top: 16px; border-top: 1px solid #D5DCD7\">\n<div style=\"font-weight: 600; font-size: 14px; color: {{accent}}\">Wynik<\u002Fdiv>\n<p style=\"margin: 4px 0 0; font-size: 16px; color: #3B4A44\">W moich dwóch testach prototypu czas procesu spadł z ok. 6 h do niecałej godziny. Skalę oszczędności trzeba potwierdzić pilotażem, chętnie omówię to na rozmowie.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<p style=\"margin: 24px 0 0; font-size: 14px; color: #4A5A53\">Aplikacje prezentuję na danych testowych. Demo i szczegóły pokażę osobiście.<\u002Fp>\n<\u002Fdiv>\n\n<div id=\"kompetencje\" style=\"max-width: 1120px; margin: 0 auto; padding: 88px 24px 24px; box-sizing: border-box\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: {{accent}}; font-weight: 500\">Kompetencje<\u002Fdiv>\n<h2 style=\"margin: 12px 0 0; max-width: 760px; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: clamp(30px, 4.4vw, 46px); line-height: 1.1; letter-spacing: -0.015em\">Ludzie, technologia i uprawnienia pod jednym dachem.<\u002Fh2>\n<div style=\"margin-top: 40px; display: flex; flex-wrap: wrap; gap: 40px 48px\">\n<div style=\"flex: 1 1 280px; min-width: 0\">\n<h3 style=\"margin: 0 0 12px; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 22px\">Zarządzanie i operacje<\u002Fh3>\n<ul style=\"margin: 0; padding-left: 20px; font-size: 16px; color: #3B4A44; display: flex; flex-direction: column; gap: 6px\">\n<li>Kaskadowe zarządzanie zespołami, do 100 osób<\u002Fli>\n<li>Budowanie struktur liderskich i mentoring<\u002Fli>\n<li>Planowanie obsady i harmonogramy<\u002Fli>\n<li>Standardy, procedury, scenariusze kryzysowe<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<div style=\"flex: 1 1 280px; min-width: 0\">\n<h3 style=\"margin: 0 0 12px; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 22px\">Technologia i automatyzacja<\u002Fh3>\n<ul style=\"margin: 0; padding-left: 20px; font-size: 16px; color: #3B4A44; display: flex; flex-direction: column; gap: 6px\">\n<li>Prototypy narzędzi domykających luki procesowe; wdrożenie na skalę razem z IT<\u002Fli>\n<li>Praktyczne wdrażanie AI w organizacji pracy<\u002Fli>\n<li>Testowanie procesów, certyfikat ISTQB<\u002Fli>\n<li>MS Office<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<div style=\"flex: 1 1 280px; min-width: 0\">\n<h3 style=\"margin: 0 0 12px; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 22px\">Uprawnienia i języki<\u002Fh3>\n<ul style=\"margin: 0; padding-left: 20px; font-size: 16px; color: #3B4A44; display: flex; flex-direction: column; gap: 6px\">\n<li>SIMP: eksploatacja (E) i dozór (D), 2026<\u002Fli>\n<li>UDT, 2026<\u002Fli>\n<li>ISTQB, 2024<\u002Fli>\n<li>Angielski B2/C1<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"sciezka\" style=\"max-width: 1120px; margin: 0 auto; padding: 88px 24px 24px; box-sizing: border-box\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: {{accent}}; font-weight: 500\">Ścieżka<\u002Fdiv>\n<h2 style=\"margin: 12px 0 0; max-width: 760px; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: clamp(30px, 4.4vw, 46px); line-height: 1.1; letter-spacing: -0.015em\">Z sali i sklepu do zarządzania zespołem i narzędziami.<\u002Fh2>\n<div style=\"margin-top: 40px; display: flex; flex-direction: column\">\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px 32px; padding: 24px 0; border-top: 1px solid #D5DCD7\">\n<div style=\"flex: 0 0 200px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #4A5A53\">03.2026 – 09.2026<\u002Fdiv>\n<div style=\"flex: 1 1 360px; min-width: 0\">\n<div style=\"font-weight: 600; font-size: 19px\">Manager Zespołu (Sektor Food), Kaufland Polska<\u002Fdiv>\n<p style=\"margin: 6px 0 0; font-size: 16px; color: #3B4A44\">Pięciu liderów i ok. 50 pracowników. Raportowanie do dyrektora marketu, mentoring liderów, własne aplikacje i AI wspierające bieżące operacje.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px 32px; padding: 24px 0; border-top: 1px solid #D5DCD7\">\n<div style=\"flex: 0 0 200px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #4A5A53\">06.2025 – 12.2025<\u002Fdiv>\n<div style=\"flex: 1 1 360px; min-width: 0\">\n<div style=\"font-weight: 600; font-size: 19px\">Koordynator ds. Sprzedaży, Leroy Merlin<\u002Fdiv>\n<p style=\"margin: 6px 0 0; font-size: 16px; color: #3B4A44\">Koordynacja działu handlowo-budowlanego, stan asortymentowy, optymalizacja procesów logistycznych w dziale.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px 32px; padding: 24px 0; border-top: 1px solid #D5DCD7\">\n<div style=\"flex: 0 0 200px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #4A5A53\">03.2017 – 08.2024<\u002Fdiv>\n<div style=\"flex: 1 1 360px; min-width: 0\">\n<div style=\"font-weight: 600; font-size: 19px\">Zastępca Kierownika Sklepu, Lidl Polska<\u002Fdiv>\n<p style=\"margin: 6px 0 0; font-size: 16px; color: #3B4A44\">Kilkunastoosobowy zespół, dokumentacja, reklamacje, nadzór techniczny obiektu i zamówienia w okresach szczytu.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px 32px; padding: 24px 0; border-top: 1px solid #D5DCD7\">\n<div style=\"flex: 0 0 200px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #4A5A53\">07.2006 – obecnie<\u002Fdiv>\n<div style=\"flex: 1 1 360px; min-width: 0\">\n<div style=\"font-weight: 600; font-size: 19px\">Szef Sekcji Wolontariuszy Ochrony, SLOT Art Festival<\u002Fdiv>\n<p style=\"margin: 6px 0 0; font-size: 16px; color: #3B4A44\">Rekrutacja i prowadzenie 30–100 wolontariuszy podczas wielodniowego festiwalu, punkty kontrolne, zarządzanie kryzysowe.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px 32px; padding: 24px 0; border-top: 1px solid #D5DCD7; border-bottom: 1px solid #D5DCD7\">\n<div style=\"flex: 0 0 200px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #4A5A53\">04.2006 – 12.2016<\u002Fdiv>\n<div style=\"flex: 1 1 360px; min-width: 0\">\n<div style=\"font-weight: 600; font-size: 19px\">Barman / Koordynator Sali<\u002Fdiv>\n<p style=\"margin: 6px 0 0; font-size: 16px; color: #3B4A44\">Obsługa gości pod presją czasu, współorganizacja wydarzeń tematycznych i kulturalnych.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"kontakt\" style=\"margin-top: 88px; background: #0F1C17; color: #F2F4F1\">\n<div style=\"max-width: 1120px; margin: 0 auto; padding: 80px 24px; box-sizing: border-box\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #8FD3B6; font-weight: 500\">Kontakt<\u002Fdiv>\n<h2 style=\"margin: 12px 0 0; max-width: 760px; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: clamp(32px, 5vw, 56px); line-height: 1.08; letter-spacing: -0.02em\">Porozmawiajmy o procesach w Waszej firmie.<\u002Fh2>\n<div style=\"margin-top: 40px; display: flex; flex-wrap: wrap; gap: 20px 56px; font-size: 19px\">\n<div>\n<div style=\"font-size: 14px; color: #C9D4CE\">E-mail<\u002Fdiv>\n<a href=\"mailto:marcinszychowiak90@gmail.com\" style=\"font-weight: 600\">marcinszychowiak90@gmail.com<\u002Fa>\n<\u002Fdiv>\n<div>\n<div style=\"font-size: 14px; color: #C9D4CE\">Telefon<\u002Fdiv>\n<a href=\"tel:+48730900424\" style=\"font-weight: 600\">+48 730 900 424<\u002Fa>\n<\u002Fdiv>\n<div>\n<div style=\"font-size: 14px; color: #C9D4CE\">LinkedIn<\u002Fdiv>\n<a href=\"https://www.linkedin.com/in/marcin-szychowiak-6a5962325/\" style=\"font-weight: 600\">marcin-szychowiak<\u002Fa>\n<\u002Fdiv>\n<div>\n<div style=\"font-size: 14px; color: #C9D4CE\">Lokalizacja<\u002Fdiv>\n<div style=\"font-weight: 600\">Kiełczów / Wrocław<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<sc-if data-dc-static=\"\" value=\"{{ false }}\"><style>x-dc>*{display:none!important}x-dc>[data-dc-static]{display:block!important}<\u002Fstyle>\n\n<div style=\"background: #F2F4F1; color: #0F1C17; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 17px; line-height: 1.55\" data-canvas-width=\"1280\" data-canvas-height=\"3200\" data-document-role=\"page\" data-label=\"Portfolio\">\n\n<div style=\"border-bottom: 1px solid #D5DCD7\">\n<div style=\"max-width: 1120px; margin: 0 auto; padding: 20px 24px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 16px 32px; justify-content: space-between; align-items: center\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px; letter-spacing: 0.06em; font-weight: 500\">MARCIN SZYCHOWIAK<\u002Fdiv>\n<nav style=\"display: flex; flex-wrap: wrap; gap: 8px 28px; font-size: 15px; font-weight: 500\">\n<a href=\"#projekty\" style=\"text-decoration: none\">Projekty<\u002Fa>\n<a href=\"#kompetencje\" style=\"text-decoration: none\">Kompetencje<\u002Fa>\n<a href=\"#sciezka\" style=\"text-decoration: none\">Ścieżka<\u002Fa>\n<a href=\"#kontakt\" style=\"text-decoration: none\">Kontakt<\u002Fa>\n<\u002Fnav>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"max-width: 1120px; margin: 0 auto; padding: 88px 24px 72px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 48px; align-items: center\">\n<div style=\"flex: 1 1 480px; min-width: 0\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #0B6E4F; font-weight: 500\">Menedżer operacyjny · usprawnianie procesów · Wrocław<\u002Fdiv>\n<h1 style=\"margin: 20px 0 0; max-width: 900px; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: clamp(38px, 6.4vw, 72px); line-height: 1.04; letter-spacing: -0.02em\">Zamieniam operacyjny chaos w procesy, które działają.<\u002Fh1>\n<p style=\"margin: 28px 0 0; max-width: 680px; font-size: 20px; color: #3B4A44\">Od 20 lat pracuję z zespołami: od sali i sklepu po festiwal z setką wolontariuszy. Gdy gotowe narzędzia nie wystarczają, projektuję rozwiązania i prototypy, a wdrożenie na skalę firmy robię razem z działem IT.<\u002Fp>\n<div style=\"margin-top: 36px; display: flex; flex-wrap: wrap; gap: 12px\">\n<a href=\"mailto:marcinszychowiak90@gmail.com\" style=\"display: inline-flex; align-items: center; min-height: 48px; padding: 0 24px; box-sizing: border-box; background: #0B6E4F; color: #FFFFFF; border-radius: 10px; font-weight: 600; text-decoration: none\">Napisz do mnie<\u002Fa>\n<a href=\"https://www.linkedin.com/in/marcin-szychowiak-6a5962325/\" style=\"display: inline-flex; align-items: center; min-height: 48px; padding: 0 24px; box-sizing: border-box; border: 1.5px solid #0F1C17; border-radius: 10px; font-weight: 600; text-decoration: none\">Profil na LinkedIn<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<img src=\"129b0482-b97a-4340-887b-f2074aefb561\" alt=\"Marcin Szychowiak\" style=\"flex: 0 1 340px; width: 340px; max-width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 16px; display: block\">\n<\u002Fdiv>\n\n<div style=\"background: #0F1C17; color: #F2F4F1\">\n<div style=\"max-width: 1120px; margin: 0 auto; padding: 48px 24px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 36px 48px\">\n<div style=\"flex: 1 1 280px; min-width: 0\">\n<div style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 44px; line-height: 1.1\">30–100<\u002Fdiv>\n<div style=\"margin-top: 8px; color: #C9D4CE; font-size: 16px\">wolontariuszy w zespole, który prowadzę na SLOT Art Festival od 2006 roku<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 280px; min-width: 0\">\n<div style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 44px; line-height: 1.1\">5 liderów<\u002Fdiv>\n<div style=\"margin-top: 8px; color: #C9D4CE; font-size: 16px\">i ok. 50 pracowników w strukturze, którą zarządzałem kaskadowo w ostatniej roli<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 280px; min-width: 0\">\n<div style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 44px; line-height: 1.1\">6 h → &lt;1 h<\u002Fdiv>\n<div style=\"margin-top: 8px; color: #C9D4CE; font-size: 16px\">w moich testach prototypu: skrócenie procesu operacyjnego w sieci handlowej<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"projekty\" style=\"max-width: 1120px; margin: 0 auto; padding: 88px 24px 24px; box-sizing: border-box\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #0B6E4F; font-weight: 500\">Projekty<\u002Fdiv>\n<h2 style=\"margin: 12px 0 0; max-width: 760px; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: clamp(30px, 4.4vw, 46px); line-height: 1.1; letter-spacing: -0.015em\">Trzy projekty, jeden schemat: problem, narzędzie, wynik.<\u002Fh2>\n\n<div style=\"margin-top: 40px; display: flex; flex-wrap: wrap; gap: 24px; align-items: stretch\">\n\n<div style=\"flex: 1 1 320px; min-width: 0; box-sizing: border-box; background: #FFFFFF; border: 1px solid #D5DCD7; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 18px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: #4A5A53\">Aplikacja · eventy<\u002Fdiv>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 26px; line-height: 1.15\">Grafik wolontariuszy w konwencji misji<\u002Fh3>\n<div>\n<div style=\"font-weight: 600; font-size: 14px; color: #0B6E4F\">Problem<\u002Fdiv>\n<p style=\"margin: 4px 0 0; font-size: 16px; color: #3B4A44\">Wolontariuszom nikt nie płaci, więc grafik musi być sprawiedliwy: pokryć zapotrzebowanie festiwalu i uwzględnić prośby ludzi oraz wydarzenia, w których chcą uczestniczyć. Dla 30 osób samo układanie grafiku (obsady, uprawnienia, przerwy między zmianami, kolizje godzin) zajmowało około 12 godzin, a dzień festiwalu opierał się na karteczce z zadaniami.<\u002Fp>\n<\u002Fdiv>\n<div>\n<div style=\"font-weight: 600; font-size: 14px; color: #0B6E4F\">Rozwiązanie<\u002Fdiv>\n<ul style=\"margin: 6px 0 0; padding-left: 20px; font-size: 16px; color: #3B4A44; display: flex; flex-direction: column; gap: 6px\">\n<li>Automatyczne planowanie obsady według zapotrzebowania, preferencji ludzi i wymogów stanowiska, np. pełnoletności.<\u002Fli>\n<li>Kontrola przerw między zmianami i kolizji godzin. Grafik sam się aktualizuje, gdy ktoś wypadnie lub dołączy.<\u002Fli>\n<li>Panel wolontariusza: meldunek w pracy, podgląd grafiku, potwierdzanie zadań zdjęciem.<\u002Fli>\n<li>Misje i agenci zamiast suchej listy zadań, co angażuje ludzi.<\u002Fli>\n<li>Raport osobisty po evencie: godziny, zadania, pochwały. Osobny raport dla organizatora.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<div style=\"margin-top: auto; padding-top: 16px; border-top: 1px solid #D5DCD7\">\n<div style=\"font-weight: 600; font-size: 14px; color: #0B6E4F\">Wynik<\u002Fdiv>\n<p style=\"margin: 4px 0 0; font-size: 16px; color: #3B4A44\">Układanie grafiku dla 30 osób: ok. 12 h → 2–3 h. Aplikacja działa w praktyce przy 20–30 użytkownikach.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex: 1 1 320px; min-width: 0; box-sizing: border-box; background: #FFFFFF; border: 1px solid #D5DCD7; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 18px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: #4A5A53\">Narzędzie wewnętrzne · RAG<\u002Fdiv>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 26px; line-height: 1.15\">Buddy: asystent procedur firmy<\u002Fh3>\n<div>\n<div style=\"font-weight: 600; font-size: 14px; color: #0B6E4F\">Problem<\u002Fdiv>\n<p style=\"margin: 4px 0 0; font-size: 16px; color: #3B4A44\">Procedury w firmach są rozrzucone, a ich znalezienie wymaga znajomości właściwych słów kluczowych. To, co dla twórców systemu i mentora jest oczywiste (np. która pieczątka do którego dokumentu), dla nowej osoby bywa przeszkodą, a każde pytanie zabiera czas także koledze.<\u002Fp>\n<\u002Fdiv>\n<div>\n<div style=\"font-weight: 600; font-size: 14px; color: #0B6E4F\">Rozwiązanie<\u002Fdiv>\n<ul style=\"margin: 6px 0 0; padding-left: 20px; font-size: 16px; color: #3B4A44; display: flex; flex-direction: column; gap: 6px\">\n<li>Jedno miejsce na procedury firmy.<\u002Fli>\n<li>Przy każdej procedurze miejsce na własne notatki i dodatkowe procesy: nowa osoba uzupełnia system tym, co sama musiała zapamiętać.<\u002Fli>\n<li>Wyszukiwanie RAG: wystarczy opisać, co trzeba załatwić, bez słów kluczowych.<\u002Fli>\n<li>Agent znajduje właściwy proces i prowadzi krok po kroku.<\u002Fli>\n<li>Projekt autorski i prototyp. Wdrożenie na skalę firmy wymaga zespołu IT i zabezpieczeń.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<div style=\"margin-top: auto; padding-top: 16px; border-top: 1px solid #D5DCD7\">\n<div style=\"font-weight: 600; font-size: 14px; color: #0B6E4F\">Wynik<\u002Fdiv>\n<p style=\"margin: 4px 0 0; font-size: 16px; color: #3B4A44\">Sprawdzone na sobie podczas wdrożenia w nowej pracy: przy dostawach bezpośrednich nie musiałem dopytywać kolegi, która pieczątka do którego dokumentu. Wystarczyło zapytać Buddy'ego, wzbogaconego o moje notatki.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex: 1 1 320px; min-width: 0; box-sizing: border-box; background: #FFFFFF; border: 1px solid #D5DCD7; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 18px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: #4A5A53\">Handel detaliczny · proces<\u002Fdiv>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 26px; line-height: 1.15\">Proces sklepowy: z 6 godzin do niecałej godziny<\u002Fh3>\n<div>\n<div style=\"font-weight: 600; font-size: 14px; color: #0B6E4F\">Problem<\u002Fdiv>\n<p style=\"margin: 4px 0 0; font-size: 16px; color: #3B4A44\">Jeden z procesów operacyjnych w sieci sklepów zajmował około sześciu godzin. Pomnożone przez całą sieć, to tysiące godzin pracy rocznie.<\u002Fp>\n<\u002Fdiv>\n<div>\n<div style=\"font-weight: 600; font-size: 14px; color: #0B6E4F\">Rozwiązanie<\u002Fdiv>\n<ul style=\"margin: 6px 0 0; padding-left: 20px; font-size: 16px; color: #3B4A44; display: flex; flex-direction: column; gap: 6px\">\n<li>Prototyp autorskiego rozwiązania skracającego proces do niecałej godziny.<\u002Fli>\n<li>Zaprojektowane z myślą o skali całej sieci, nie jednego sklepu.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<div style=\"margin-top: auto; padding-top: 16px; border-top: 1px solid #D5DCD7\">\n<div style=\"font-weight: 600; font-size: 14px; color: #0B6E4F\">Wynik<\u002Fdiv>\n<p style=\"margin: 4px 0 0; font-size: 16px; color: #3B4A44\">W moich dwóch testach prototypu czas procesu spadł z ok. 6 h do niecałej godziny. Skalę oszczędności trzeba potwierdzić pilotażem, chętnie omówię to na rozmowie.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<p style=\"margin: 24px 0 0; font-size: 14px; color: #4A5A53\">Aplikacje prezentuję na danych testowych. Demo i szczegóły pokażę osobiście.<\u002Fp>\n<\u002Fdiv>\n\n<div id=\"kompetencje\" style=\"max-width: 1120px; margin: 0 auto; padding: 88px 24px 24px; box-sizing: border-box\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #0B6E4F; font-weight: 500\">Kompetencje<\u002Fdiv>\n<h2 style=\"margin: 12px 0 0; max-width: 760px; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: clamp(30px, 4.4vw, 46px); line-height: 1.1; letter-spacing: -0.015em\">Ludzie, technologia i uprawnienia pod jednym dachem.<\u002Fh2>\n<div style=\"margin-top: 40px; display: flex; flex-wrap: wrap; gap: 40px 48px\">\n<div style=\"flex: 1 1 280px; min-width: 0\">\n<h3 style=\"margin: 0 0 12px; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 22px\">Zarządzanie i operacje<\u002Fh3>\n<ul style=\"margin: 0; padding-left: 20px; font-size: 16px; color: #3B4A44; display: flex; flex-direction: column; gap: 6px\">\n<li>Kaskadowe zarządzanie zespołami, do 100 osób<\u002Fli>\n<li>Budowanie struktur liderskich i mentoring<\u002Fli>\n<li>Planowanie obsady i harmonogramy<\u002Fli>\n<li>Standardy, procedury, scenariusze kryzysowe<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<div style=\"flex: 1 1 280px; min-width: 0\">\n<h3 style=\"margin: 0 0 12px; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 22px\">Technologia i automatyzacja<\u002Fh3>\n<ul style=\"margin: 0; padding-left: 20px; font-size: 16px; color: #3B4A44; display: flex; flex-direction: column; gap: 6px\">\n<li>Prototypy narzędzi domykających luki procesowe; wdrożenie na skalę razem z IT<\u002Fli>\n<li>Praktyczne wdrażanie AI w organizacji pracy<\u002Fli>\n<li>Testowanie procesów, certyfikat ISTQB<\u002Fli>\n<li>MS Office<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<div style=\"flex: 1 1 280px; min-width: 0\">\n<h3 style=\"margin: 0 0 12px; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: 22px\">Uprawnienia i języki<\u002Fh3>\n<ul style=\"margin: 0; padding-left: 20px; font-size: 16px; color: #3B4A44; display: flex; flex-direction: column; gap: 6px\">\n<li>SIMP: eksploatacja (E) i dozór (D), 2026<\u002Fli>\n<li>UDT, 2026<\u002Fli>\n<li>ISTQB, 2024<\u002Fli>\n<li>Angielski B2/C1<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"sciezka\" style=\"max-width: 1120px; margin: 0 auto; padding: 88px 24px 24px; box-sizing: border-box\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #0B6E4F; font-weight: 500\">Ścieżka<\u002Fdiv>\n<h2 style=\"margin: 12px 0 0; max-width: 760px; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: clamp(30px, 4.4vw, 46px); line-height: 1.1; letter-spacing: -0.015em\">Z sali i sklepu do zarządzania zespołem i narzędziami.<\u002Fh2>\n<div style=\"margin-top: 40px; display: flex; flex-direction: column\">\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px 32px; padding: 24px 0; border-top: 1px solid #D5DCD7\">\n<div style=\"flex: 0 0 200px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #4A5A53\">03.2026 – 09.2026<\u002Fdiv>\n<div style=\"flex: 1 1 360px; min-width: 0\">\n<div style=\"font-weight: 600; font-size: 19px\">Manager Zespołu (Sektor Food), Kaufland Polska<\u002Fdiv>\n<p style=\"margin: 6px 0 0; font-size: 16px; color: #3B4A44\">Pięciu liderów i ok. 50 pracowników. Raportowanie do dyrektora marketu, mentoring liderów, własne aplikacje i AI wspierające bieżące operacje.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px 32px; padding: 24px 0; border-top: 1px solid #D5DCD7\">\n<div style=\"flex: 0 0 200px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #4A5A53\">06.2025 – 12.2025<\u002Fdiv>\n<div style=\"flex: 1 1 360px; min-width: 0\">\n<div style=\"font-weight: 600; font-size: 19px\">Koordynator ds. Sprzedaży, Leroy Merlin<\u002Fdiv>\n<p style=\"margin: 6px 0 0; font-size: 16px; color: #3B4A44\">Koordynacja działu handlowo-budowlanego, stan asortymentowy, optymalizacja procesów logistycznych w dziale.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px 32px; padding: 24px 0; border-top: 1px solid #D5DCD7\">\n<div style=\"flex: 0 0 200px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #4A5A53\">03.2017 – 08.2024<\u002Fdiv>\n<div style=\"flex: 1 1 360px; min-width: 0\">\n<div style=\"font-weight: 600; font-size: 19px\">Zastępca Kierownika Sklepu, Lidl Polska<\u002Fdiv>\n<p style=\"margin: 6px 0 0; font-size: 16px; color: #3B4A44\">Kilkunastoosobowy zespół, dokumentacja, reklamacje, nadzór techniczny obiektu i zamówienia w okresach szczytu.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px 32px; padding: 24px 0; border-top: 1px solid #D5DCD7\">\n<div style=\"flex: 0 0 200px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #4A5A53\">07.2006 – obecnie<\u002Fdiv>\n<div style=\"flex: 1 1 360px; min-width: 0\">\n<div style=\"font-weight: 600; font-size: 19px\">Szef Sekcji Wolontariuszy Ochrony, SLOT Art Festival<\u002Fdiv>\n<p style=\"margin: 6px 0 0; font-size: 16px; color: #3B4A44\">Rekrutacja i prowadzenie 30–100 wolontariuszy podczas wielodniowego festiwalu, punkty kontrolne, zarządzanie kryzysowe.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px 32px; padding: 24px 0; border-top: 1px solid #D5DCD7; border-bottom: 1px solid #D5DCD7\">\n<div style=\"flex: 0 0 200px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #4A5A53\">04.2006 – 12.2016<\u002Fdiv>\n<div style=\"flex: 1 1 360px; min-width: 0\">\n<div style=\"font-weight: 600; font-size: 19px\">Barman / Koordynator Sali<\u002Fdiv>\n<p style=\"margin: 6px 0 0; font-size: 16px; color: #3B4A44\">Obsługa gości pod presją czasu, współorganizacja wydarzeń tematycznych i kulturalnych.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"kontakt\" style=\"margin-top: 88px; background: #0F1C17; color: #F2F4F1\">\n<div style=\"max-width: 1120px; margin: 0 auto; padding: 80px 24px; box-sizing: border-box\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #8FD3B6; font-weight: 500\">Kontakt<\u002Fdiv>\n<h2 style=\"margin: 12px 0 0; max-width: 760px; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; font-size: clamp(32px, 5vw, 56px); line-height: 1.08; letter-spacing: -0.02em\">Porozmawiajmy o procesach w Waszej firmie.<\u002Fh2>\n<div style=\"margin-top: 40px; display: flex; flex-wrap: wrap; gap: 20px 56px; font-size: 19px\">\n<div>\n<div style=\"font-size: 14px; color: #C9D4CE\">E-mail<\u002Fdiv>\n<a href=\"mailto:marcinszychowiak90@gmail.com\" style=\"font-weight: 600\">marcinszychowiak90@gmail.com<\u002Fa>\n<\u002Fdiv>\n<div>\n<div style=\"font-size: 14px; color: #C9D4CE\">Telefon<\u002Fdiv>\n<a href=\"tel:+48730900424\" style=\"font-weight: 600\">+48 730 900 424<\u002Fa>\n<\u002Fdiv>\n<div>\n<div style=\"font-size: 14px; color: #C9D4CE\">LinkedIn<\u002Fdiv>\n<a href=\"https://www.linkedin.com/in/marcin-szychowiak-6a5962325/\" style=\"font-weight: 600\">marcin-szychowiak<\u002Fa>\n<\u002Fdiv>\n<div>\n<div style=\"font-size: 14px; color: #C9D4CE\">Lokalizacja<\u002Fdiv>\n<div style=\"font-weight: 600\">Kiełczów / Wrocław<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fsc-if><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#0B6E4F&quot;},&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:3200}}\">\nclass Component extends DCLogic {\nrenderVals() {\nreturn { accent: this.props.accent ?? '#0B6E4F' };\n}\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
